<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Login</title>
<style>body { font-family: Arial; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 300px; }
input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
.flash { color: red; font-size: 14px; text-align: center; }</style>
</head>
<body>
<div class="box">
    <h2>Iniciar Sessão</h2>
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
    <form method="POST">
        <label>Utilizador:</label><input type="text" name="username" required>
        <label>Senha:</label><input type="password" name="password" required>
        <button type="submit">Entrar</button>
    </form>
    <p style="text-align: center; margin-top: 15px;"><a href="{{ url_for('index') }}">Voltar ao Início</a></p>
</div>
</body>
</html>
