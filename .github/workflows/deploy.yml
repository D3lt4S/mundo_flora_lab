name: Build, Push e Deploy

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login no Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build e Push da imagem
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/mundo_flora:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mundo_flora:latest

      - name: Atualizar Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name mundo-flora-lab \
              --resource-group eatus-test \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/mundo_flora:latest
